[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webde-reader"
version = "0.1.0"
description = "Strictly read-only WEB.DE IMAP client with CLI and local FastMCP server"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "webde-readonly-mcp contributors" }]
dependencies = []

[project.optional-dependencies]
secrets = ["keyring>=25.6,<27"]
mcp = ["fastmcp==4.1.3", "keyring>=25.6,<27"]
dev = ["fastmcp==4.1.3", "keyring>=25.6,<27", "pytest>=8.3,<10"]

[project.scripts]
webde-reader = "webde_reader.cli:main"
webde-reader-mcp = "webde_reader.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webde_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

